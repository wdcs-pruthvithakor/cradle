<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cradle — grow a civilization</title>
<meta name="description" content="A living civilization in your browser. Settle a painted island, grow towns through the ages, and write your people's chronicle.">
<meta name="theme-color" content="#2c5f7a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;0,800;1,500&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/cradle.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%232c5f7a'/%3E%3Cpath d='M6 22h20L16 8z' fill='%238fb35c'/%3E%3Cpath d='M13 22v-5h6v5' fill='%23efe4cf'/%3E%3Cpath d='M12 17l4-4 4 4' fill='%23c2562b'/%3E%3C/svg%3E">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-food" viewBox="0 0 24 24"><path d="M12 22V9M12 9c-3-1-4-4-4-6 3 1 4 3 4 6zm0 0c3-1 4-4 4-6-3 1-4 3-4 6zm0 5c-3-1-4-3-4-5 3 1 4 2 4 5zm0 0c3-1 4-3 4-5-3 1-4 2-4 5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-wood" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="8" rx="4" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="7" cy="12" r="2" fill="currentColor"/></symbol>
    <symbol id="i-stone" viewBox="0 0 24 24"><path d="M4 18l3-9 6-3 7 5-2 7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M7 9l5 4 6-2M12 13v5" stroke="currentColor" stroke-width="1.4" fill="none"/></symbol>
    <symbol id="i-ore" viewBox="0 0 24 24"><path d="M5 19L15 9M13 5c3 0 6 3 6 6l-4-2-2-4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-knowledge" viewBox="0 0 24 24"><path d="M4 5h6a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-gold" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 8v8M9.5 10.5h4a1.5 1.5 0 0 1 0 3h-3" stroke="currentColor" stroke-width="1.6" fill="none"/></symbol>
    <symbol id="i-happy" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 14c2 2.5 6 2.5 8 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="9" cy="10" r="1.2" fill="currentColor"/><circle cx="15" cy="10" r="1.2" fill="currentColor"/></symbol>
    <symbol id="i-health" viewBox="0 0 24 24"><path d="M12 20s-8-5-8-11a4 4 0 0 1 8-1 4 4 0 0 1 8 1c0 6-8 11-8 11z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-pop" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 20c0-4 3-6 6-6s6 2 6 6" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="17" cy="9" r="2.4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M16 14c3 0 5 2 5 5" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-house" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 20v-5h4v5" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
  </defs>
</svg>

<canvas id="world" aria-label="Map of your civilization. Click a tile or town to inspect it." role="img"></canvas>

<header class="hud" id="hud">
  <button class="brand" id="menuBtn" aria-label="Open game menu"><span class="brand-mark" aria-hidden="true"></span><span><b>Cradle</b><small id="civName"></small></span></button>
  <div class="date"><b id="dateLabel"></b><span id="eraLabel"></span></div>
  <ul class="res" id="resBar" aria-label="Resources"></ul>
  <div class="score" title="Score"><small>Score</small><b id="scoreLabel">0</b></div>
</header>

<div class="time" id="timeCtrl" role="group" aria-label="Game speed">
  <button data-speed="0" aria-label="Pause (Space)"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button>
  <button data-speed="1" aria-label="Normal speed (1)"><svg viewBox="0 0 24 24"><path d="M8 5l10 7-10 7z" fill="currentColor"/></svg></button>
  <button data-speed="2" aria-label="Fast (2)"><svg viewBox="0 0 24 24"><path d="M3 5l9 7-9 7zM12 5l9 7-9 7z" fill="currentColor"/></svg></button>
  <button data-speed="4" aria-label="Fastest (3)"><svg viewBox="0 0 24 24"><path d="M1 6l7 6-7 6zM8 6l7 6-7 6zM15 6l7 6-7 6z" fill="currentColor"/></svg></button>
  <span class="season-ring" aria-hidden="true"><i id="seasonRing"></i></span>
</div>

<aside class="panel left" id="leftPanel" aria-live="polite" hidden></aside>

<aside class="panel right" id="rightPanel">
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="council" aria-selected="true">Council</button>
    <button role="tab" data-tab="research" aria-selected="false">Research</button>
    <button role="tab" data-tab="chronicle" aria-selected="false">Chronicle</button>
    <button role="tab" data-tab="goals" aria-selected="false">Goals</button>
  </nav>
  <div class="tab-body" id="tabBody" role="tabpanel"></div>
  <button class="collapse" id="collapseRight" aria-label="Collapse side panel">›</button>
</aside>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="tooltip" id="tooltip" role="tooltip" hidden></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" hidden><div class="modal-card" id="modalCard"></div></div>
<div class="coach" id="coach" hidden></div>

<script type="module" src="src/main.js"></script>
<noscript><p style="padding:20px">Cradle needs JavaScript to run.</p></noscript>
</body>
</html>
